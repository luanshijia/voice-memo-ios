name: VoiceMemo
options:
  bundleIdPrefix: com.luanshijia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# 用官方「源码包」而不是「预编译包」:预编译包声明 swift-tools-version:6.2,
# 需要 Xcode 26;CI 的 macos-15 runner 是 Xcode 16.4(只到 Swift 6.1),会被解析器直接拒绝
# (实测报错:Dependencies could not be resolved because ... incompatible tools version (6.2.0))。
# 源码包声明 swift-tools-version:6.1(包内注释写明 "Xcode16.3+"),当前 runner 可用。
# 代价:CI 里要现编 SDK(慢一些);换来的是不依赖 Xcode 26。
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.18.0"

targets:
  # 广播扩展作为第二个 LiveKit 参与者,只发布 ReplayKit audioApp 系统声音。
  VoiceMemoBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
    dependencies:
      # 扩展独立连入会议室;identity 与主 App 的麦克风参与者分开。
      - package: LiveKit
        product: LiveKit
    info:
      path: Broadcast/Info.plist
      properties:
        # 必须是纯 ASCII:SideStore 给扩展注册 App ID 时会拼出
        # "<App 显示名> <扩展显示名>" 当 appIdName,中文/非 ASCII 会被 Apple 直接拒绝
        # (实测报错:An invalid value ... was provided for the parameter 'appIdName'.)
        # → 显示名一律用纯 ASCII,才能走「每个扩展注册 App ID」这条路。
        CFBundleDisplayName: VoiceMemoBroadcast
        # 版本号的唯一真相源是下面 settings.MARKETING_VERSION / CURRENT_PROJECT_VERSION。
        # 这里必须写 $(...) 引用:手写字面量会【覆盖】settings(实测 0.9.5 那次就是因为
        # 这里还写着 0.9.4,打出来的包版本号没变)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 必须写在 properties 里:XcodeGen 会用这里的属性【覆盖】path 指向的 Info.plist,
        # 只写在文件里会被覆盖掉(实测:CI 报 "NSExtension:NSExtensionPointIdentifier Does Not Exist")
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
        # 扩展自己要用 https 连回家里(回信道 ②):给本地网络权限说明
        NSLocalNetworkUsageDescription: 连接你家里的转写服务(xEdge 私网)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.voicememo.broadcast
        PRODUCT_NAME: VoiceMemoBroadcast
        MARKETING_VERSION: "0.9.29"
        CURRENT_PROJECT_VERSION: "98"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # LiveKit 的动态框架(RTC/UniFFI)由主 App 嵌入;扩展运行时从主 App Frameworks 查找。
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # App Group:主 App 传入短期扩展 token,并读取扩展状态日志。
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

  VoiceMemo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Assets.xcassets        # 主屏图标(2026-10-15 加):以前包里根本没有图标,装到主屏是空白的
    dependencies:
      - package: LiveKit
        product: LiveKit
      # 扩展嵌进 PlugIns/;不签名 —— 侧载时由 SideStore 一起重签
      - target: VoiceMemoBroadcast
        embed: true
        codeSign: false
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: VoiceMemo
        # 必须写成带引号的字符串:YAML 会把 6 当数字,CFNetwork 拼 User-Agent 时
        # 拿到数字会抛异常直接 abort(实测崩溃栈:initializeUserAgentString)
        # 版本号唯一真相源是 settings.MARKETING_VERSION / CURRENT_PROJECT_VERSION(下面是 $(...) 引用)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 图标:光设 ASSETCATALOG_COMPILER_APPICON_NAME 不够 —— 本工程 Info.plist 是手写的
        # (GENERATE_INFOPLIST_FILE: NO),必须显式给 CFBundleIconName,否则主屏还是空白
        CFBundleIconName: AppIcon
        # 连接参数默认值:源码与 Info.plist 里只有占位,真值由 CI 用 Secrets 覆盖 build setting。
        # 不配也能跑 —— App 会回落到中性占位,用户在设置页填一次即可。
        VMDefaultDevice: "$(VM_DEFAULT_DEVICE)"
        VMDefaultUser: "$(VM_DEFAULT_USER)"
        UILaunchScreen: {}
        # 锁屏/后台继续录音的关键:后台音频模式
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 用于会议录音与实时转写
        # 走 wss:// + 自家 CA 签发的证书,ATS 保持 iOS 默认的严格策略(不加任何豁免)。
        NSLocalNetworkUsageDescription: 连接你家里的转写服务(xEdge 私网)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.voicememo
        PRODUCT_NAME: VoiceMemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 连接参数默认值的占位:CI 打包时用 xcodebuild 的参数覆盖(值来自仓库 Secrets,
        # 不落在代码里)。不覆盖时 App 回落到中性占位,用户在设置页填一次即可。
        VM_DEFAULT_DEVICE: iphone
        VM_DEFAULT_USER: owner
        MARKETING_VERSION: "0.9.29"
        CURRENT_PROJECT_VERSION: "98"
        SWIFT_VERSION: "5.0"
        # 显式锁定:接 SwiftPM 依赖后产物 Info.plist 的 MinimumOSVersion 曾变成 13.0(依赖的声明下限),
        # 而代码用了 iOS 17 的 API —— 写死避免漂移。
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # App Group:与广播扩展共享容器
        CODE_SIGN_ENTITLEMENTS: Support/VoiceMemo.entitlements
        # 纯验证 CI 出包通路:不签名
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
