name: VoiceMemo
options:
  bundleIdPrefix: com.luanshijia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# 用官方「源码包」而不是「预编译包」:预编译包声明 swift-tools-version:6.2,
# 需要 Xcode 26;CI 的 macos-15 runner 是 Xcode 16.4(只到 Swift 6.1),会被解析器直接拒绝
# (实测报错:Dependencies could not be resolved because ... incompatible tools version (6.2.0))。
# 源码包声明 swift-tools-version:6.1(包内注释写明 "Xcode16.3+"),当前 runner 可用。
# 代价:CI 里要现编 SDK(慢一些);换来的是不依赖 Xcode 26。
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: "2.18.0"

targets:
  VoiceMemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - ControlResponseFixtures.json
      - path: Tests/ControlResponseFixtures.json
        buildPhase: resources
    dependencies:
      - target: VoiceMemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.voicememo.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VoiceMemo.app/VoiceMemo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
  VoiceMemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # Retained on disk as a reviewed migration backup; never compiled into new builds.
          - BroadcastProbe.swift
          - LegacySessionAdapter.swift
      - Shared
      - Assets.xcassets        # 主屏图标(2026-10-15 加):以前包里根本没有图标,装到主屏是空白的
      - path: Contracts/revision.json
        buildPhase: resources
    dependencies:
      - package: LiveKit
        product: LiveKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: VoiceMemo
        # 必须写成带引号的字符串:YAML 会把 6 当数字,CFNetwork 拼 User-Agent 时
        # 拿到数字会抛异常直接 abort(实测崩溃栈:initializeUserAgentString)
        # 版本号唯一真相源是 settings.MARKETING_VERSION / CURRENT_PROJECT_VERSION(下面是 $(...) 引用)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 图标:光设 ASSETCATALOG_COMPILER_APPICON_NAME 不够 —— 本工程 Info.plist 是手写的
        # (GENERATE_INFOPLIST_FILE: NO),必须显式给 CFBundleIconName,否则主屏还是空白
        CFBundleIconName: AppIcon
        # 连接参数默认值:源码与 Info.plist 里只有占位,真值由 CI 用 Secrets 覆盖 build setting。
        # 不配也能跑 —— App 会回落到中性占位,用户在设置页填一次即可。
        VMDefaultDevice: "$(VM_DEFAULT_DEVICE)"
        VMDefaultUser: "$(VM_DEFAULT_USER)"
        UILaunchScreen: {}
        # 锁屏/后台继续录音的关键:后台音频模式
        UIBackgroundModes:
          - audio
          - bluetooth-central
        NSMicrophoneUsageDescription: 用于会议录音与实时转写
        NSBluetoothAlwaysUsageDescription: 用于连接 CB08 外置录音设备
        # 走 wss:// + 自家 CA 签发的证书,ATS 保持 iOS 默认的严格策略(不加任何豁免)。
        NSLocalNetworkUsageDescription: 连接你家里的转写服务(xEdge 私网)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanshijia.voicememo
        PRODUCT_NAME: VoiceMemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 连接参数默认值的占位:CI 打包时用 xcodebuild 的参数覆盖(值来自仓库 Secrets,
        # 不落在代码里)。不覆盖时 App 回落到中性占位,用户在设置页填一次即可。
        VM_DEFAULT_DEVICE: iphone
        VM_DEFAULT_USER: owner
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "110"
        SWIFT_VERSION: "5.0"
        # 显式锁定:接 SwiftPM 依赖后产物 Info.plist 的 MinimumOSVersion 曾变成 13.0(依赖的声明下限),
        # 而代码用了 iOS 17 的 API —— 写死避免漂移。
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # App Group:与广播扩展共享容器
        CODE_SIGN_ENTITLEMENTS: Support/VoiceMemo.entitlements
        # 纯验证 CI 出包通路:不签名
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/CB08
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/CB08
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - $(inherited)
          - $(SRCROOT)/Vendor/CB08
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - $(inherited)
          - -lPNote

schemes:
  VoiceMemo:
    build:
      targets:
        VoiceMemo: all
    test:
      targets:
        - VoiceMemoTests
