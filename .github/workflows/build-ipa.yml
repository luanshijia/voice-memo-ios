name: build-ipa

# 在云端 macOS 上生成 Xcode 工程 → 编译 → 产出 .ipa(ad-hoc 签名,把 entitlements 嵌进包)
# 为什么是 ad-hoc 而不是真签名:真签名要证书,而证书由手机上的 SideStore 用免费 Apple ID 完成。
# 但我们**必须**让包里带上 entitlement(App Group)——否则 SideStore 无从得知"这个 App 要哪个
# App Group",只能靠人手在开发者门户里填(实测踩过,兜了一圈)。ad-hoc 签名(`-`)不是有效证书、
# 不能直接在真机跑,但它会把 entitlements 真的写进包的签名里,SideStore 重签时就能读到。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cb08_probe:
        description: Include the device-only CB08 diagnostics view in the iPhoneOS archive
        type: boolean
        required: false
        default: false

jobs:
  build:
    # 公开仓库的标准 macOS runner 里,macos-15 本身就是 arm64(M1,预装 Xcode 16.x);文档里
    # arm64 的合法标签只有 macos-latest / macos-14 / macos-15 / macos-26。
    # 没有 macos-15-arm64 这个标签:用它 job 会永远排队(实测排队 24 小时后被自动取消,
    # job.started_at 为 null),不是编译失败。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 核对契约快照与生成代码
        run: python3 tools/check-contracts.py

      - name: 工具链版本
        run: |
          sw_vers
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen --version
          xcodegen generate
          # Source archives must not appear in any generated build target.
          python3 - <<'PY'
          from pathlib import Path
          project = Path("VoiceMemo.xcodeproj/project.pbxproj").read_text()
          for retired in ("BroadcastProbe.swift", "LegacySessionAdapter.swift", "SampleHandler.swift",
                          "LiveKitBroadcastPublisher.swift", "VoiceMemoBroadcast"):
              assert retired not in project, retired + " is still in the generated project"
          print("Retired source archives excluded from all targets")
          PY
          ls -la

      - name: Swift 行为回归
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          test -n "$DEVICE_ID"
          xcodebuild -project VoiceMemo.xcodeproj -scheme VoiceMemo \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/VoiceMemo-tests" \
            -resultBundlePath "$RUNNER_TEMP/VoiceMemo-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test

      - name: 模拟器启动并截取主界面(仅手动运行)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 16 Pro")][0].udid // empty')"
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          fi
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          # Reuse the tested simulator binary; avoid rebuilding LiveKit for Release.
          APP="$RUNNER_TEMP/VoiceMemo-tests/Build/Products/Debug-iphonesimulator/VoiceMemo.app"
          test -d "$APP"
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" com.luanshijia.voicememo
          sleep 5
          mkdir -p "$RUNNER_TEMP/VoiceMemo-ui-preview"
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/VoiceMemo-ui-preview/main.png"

      - name: 编译(不签名)
        run: |
          set -o pipefail
          PROBE_CONDITION=""
          if [[ "${{ inputs.cb08_probe }}" == "true" ]]; then PROBE_CONDITION="CB08_PROBE"; fi
          # 设备名与使用者的真值只在这里出现:值来自仓库 Secrets(日志里被遮蔽),
          # 由 build setting 注入 Info.plist。代码与 project.yml 里只有中性占位。
          xcodebuild \
            -project VoiceMemo.xcodeproj \
            -scheme VoiceMemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VoiceMemo.xcarchive" \
            VM_DEFAULT_DEVICE="${VM_DEFAULT_DEVICE}" \
            VM_DEFAULT_USER="${VM_DEFAULT_USER}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$PROBE_CONDITION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
        env:
          VM_DEFAULT_DEVICE: ${{ secrets.VM_DEFAULT_DEVICE }}
          VM_DEFAULT_USER: ${{ secrets.VM_DEFAULT_USER }}

      - name: 嵌入 entitlements(ad-hoc 签名)
        run: |
          set -eux
          APP="$RUNNER_TEMP/VoiceMemo.xcarchive/Products/Applications/VoiceMemo.app"
          APPEX="$APP/PlugIns/VoiceMemoBroadcast.appex"
          test ! -e "$APPEX"
          codesign --force --sign - --timestamp=none --entitlements Support/VoiceMemo.entitlements "$APP"
          echo "=== 主包 entitlements ==="; codesign -d --entitlements :- "$APP" 2>&1 || true
          # 硬校验:App Group 必须真的进包(CI 绿≠东西在包里,这条踩过好几次)
          DUMP="$(codesign -d --entitlements :- "$APP" 2>&1 || codesign -d --entitlements - "$APP" 2>&1 || true)"
          echo "$DUMP" | grep -q "group.com.luanshijia.voicememo" \
            || { echo "缺 App Group entitlement: $APP"; exit 1; }
          echo "主 App 的历史迁移兼容 entitlement 仍在包里 ✓"

      - name: 打包成 .ipa
        run: |
          set -eux
          APP="$RUNNER_TEMP/VoiceMemo.xcarchive/Products/Applications/VoiceMemo.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          # The ReplayKit extension is retired and must not be embedded.
          test ! -e "$APP/PlugIns/VoiceMemoBroadcast.appex"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry VoiceMemo-unsigned.ipa Payload
          ls -la VoiceMemo-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemo-unsigned-ipa
          path: ${{ runner.temp }}/ipa/VoiceMemo-unsigned.ipa
          if-no-files-found: error

      - name: 上传模拟器界面截图(仅手动运行)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemo-ui-preview
          path: ${{ runner.temp }}/VoiceMemo-ui-preview/main.png
          if-no-files-found: error

      - name: 上传测试与依赖解析证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemo-build-evidence
          path: |
            ${{ runner.temp }}/VoiceMemo-tests.xcresult
            VoiceMemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            Contracts/revision.json
          if-no-files-found: warn
